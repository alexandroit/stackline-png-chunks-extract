name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-branch CI run containing the reviewed npm-package artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI and CodeQL for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          test "$GITHUB_REPOSITORY" = alexandroit/stackline-png-chunks-extract
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == "main" and .event == "push" and
            .head_repository.full_name == $repo and .path == ".github/workflows/ci.yml" and
            .status == "completed" and .conclusion == "success"
          ' "$RUNNER_TEMP/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" > "$RUNNER_TEMP/codeql.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .workflow_runs[0] | .head_sha == $sha and
            .status == "completed" and .conclusion == "success"
          ' "$RUNNER_TEMP/codeql.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Check the CI artifact identity
        shell: bash
        run: |
          set -euo pipefail
          archive="artifact/stackline-png-chunks-extract-$(node -p "require('./package.json').version").tgz"
          test "$(find artifact -name '*.tgz' | wc -l)" -eq 1
          tar -xOf "$archive" package/package.json > "$RUNNER_TEMP/packed-package.json"
          node -e "require('node:assert/strict').deepEqual(require(process.argv[1]), require('./package.json'))" "$RUNNER_TEMP/packed-package.json"
          sha256sum "$archive"
          npm --version
      - name: Check whether this exact artifact is already published
        id: registry
        run: node scripts/check-publish-status.mjs artifact/*.tgz
      - name: Publish the exact CI tarball with OIDC and provenance
        if: steps.registry.outputs.published == 'false'
        run: npm publish ./artifact/*.tgz --access public --provenance --ignore-scripts
      - name: Verify npm bytes, normal installs, signatures, and provenance
        run: node scripts/verify-registry.mjs artifact/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a7 # v7.0.1
        with:
          name: published-package-evidence
          path: artifact/*
          if-no-files-found: error
          retention-days: 90
